name: Daily data refresh

# Runs src/daily_run.py on a schedule: fetches every watched TurkStat +
# Eurostat + TurkStat-press indicator, diffs each dataflow's fresh snapshot
# against the previous one, and opens a PR only if a demographic value
# substantively changed. No change, no PR, nothing to review.
#
# A catalogue-level change (a TurkStat service changing shape, not a
# demographic figure) never opens a PR: it goes to data/technical_changes_log.md
# via a direct commit. See technical_log.py.
#
# Manual setup this workflow depends on, none of it done by any code path:
#   - TUIK_API_KEY repository secret
#   - BLUESKY_DATA_HANDLE / BLUESKY_DATA_APP_PASSWORD repository secrets for
#     the instant-notice account. Until these exist, daily_run.py still
#     updates changes.xml correctly but the Bluesky step fails with a clear
#     "credentials not configured" error, which is why the run exits
#     non-zero rather than silently
#   - WEBPAGE_PAT repository secret: a fine-grained PAT with contents:write
#     on the site repo only, to sync changes.xml + veridem/index.html there
#   - Settings -> Actions -> General -> Workflow permissions -> "Read and
#     write permissions", AND the separate "Allow GitHub Actions to create
#     and approve pull requests" checkbox. Both are needed for the PR step
#     to succeed with the default GITHUB_TOKEN
#
# The press connector needs no secret (the press API takes no auth, only an
# X-Requested-With header) but does need `xlrd` in requirements.txt to read
# the .xls tables it returns. Do not drop that dependency.

on:
  schedule:
    # 07:30 UTC = 10:30 Türkiye Time (fixed UTC+3 year-round; Türkiye
    # abolished DST in 2016, so this needs no seasonal adjustment). TurkStat
    # publishes at 10:00 TRT, so this is a 30-minute buffer after it.
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      reset_feed:
        description: "Empty changes.xml before syncing (starts the channel over)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Safeguard, not a normal-case budget. TurkStat's SDMX service does
    # accept a request and then never answer, which is what the shorter
    # per-request timeout in tuik_client.py handles; this is the outer bound
    # so a genuine hang fails within the hour instead of sitting "running"
    # for GitHub's 6-hour default and never sending a failure email.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Checked out early and unconditionally so its persisted changes.xml can
      # seed this run's local copy before anything appends to it. Without
      # this, a fresh checkout has no local changes.xml to prepend onto (it is
      # deliberately never committed here, see feed.py) and the sync would
      # overwrite the real public history with just this run's entries.
      # Read-only until the sync step below.
      - name: Checkout webpage repo
        uses: actions/checkout@v4
        with:
          repository: keskinfaruk/webpage
          token: ${{ secrets.WEBPAGE_PAT }}
          path: webpage

      # Seed this repo's working copy of the feed from the published one before
      # anything appends to it. A fresh checkout has no local changes.xml (it is
      # never committed here), so without this the run would prepend onto an
      # empty feed and the sync would overwrite the real public history.
      - name: Seed local changes feed
        working-directory: src
        run: |
          python -c "
          from pathlib import Path
          from feed import seed_from_published
          print('seeded' if seed_from_published(Path('../webpage')) else 'nothing to seed')
          "

      # Manual only, and deliberately after seeding so it discards the published
      # history rather than a fresh empty file.
      - name: Reset changes feed
        if: inputs.reset_feed
        working-directory: src
        run: python -c "from feed import reset; print('emptied', reset())"

      - name: Run daily fetch and diff
        id: run
        working-directory: src
        env:
          # Without this Python buffers stdout (the step is not a tty) and a
          # step that gets killed logs nothing at all about where it was.
          PYTHONUNBUFFERED: "1"
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
          BLUESKY_DATA_HANDLE: ${{ secrets.BLUESKY_DATA_HANDLE }}
          BLUESKY_DATA_APP_PASSWORD: ${{ secrets.BLUESKY_DATA_APP_PASSWORD }}
        run: python daily_run.py

      # A failed step above already turns this run red, and GitHub emails the
      # owner about failed scheduled runs by default. That is the whole
      # failure-notification mechanism, deliberately, rather than a second
      # custom-built one.

      - name: Open or update PR
        if: steps.run.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Data update"
          body-path: CHANGE_REPORT.md
          branch: daily-data-update
          commit-message: "Daily data update"
          delete-branch: true
          add-paths: |
            data/raw/**

      # Catalogue-level changes: direct commit to main, no PR. Also gated on
      # has_new_candidates so a candidate snapshot with no other catalogue
      # change still gets committed.
      - name: Commit technical changes log
        if: steps.run.outputs.has_technical_changes == 'true' || steps.run.outputs.has_new_candidates == 'true'
        run: |
          git config user.name "veridem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/technical_changes_log.md data/inventory
          if git diff --cached --quiet; then
            echo "Nothing staged -- skipping commit."
          else
            git commit -m "Technical changes log: catalogue update"
            git push
          fi

      # One persistent issue, commented on each time new candidates appear,
      # rather than a new issue every run.
      - name: Open or comment on candidate-indicators issue
        if: steps.run.outputs.has_new_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Candidate indicators for review"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file CANDIDATE_INDICATORS.md
          else
            gh issue create --title "$TITLE" --body-file CANDIDATE_INDICATORS.md
          fi

      - name: Sync changes feed to faruk.page
        working-directory: src
        run: python sync_webpage.py ../webpage
